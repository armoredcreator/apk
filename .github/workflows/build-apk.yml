name: Compilar APK Android
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/framematch-android]
    paths:
      - 'app/**'
      - 'tests_jdk/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar motor de cores (Java puro)
        run: bash tests_jdk/run.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar plataforma Android SDK (runner nativo)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar e testar o aplicativo
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FrameMatch-Android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
