name: Compilar APK Android
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/framematch-android]
    paths:
      - 'app/**'
      - 'tests_jdk/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar motor de cores (Java puro)
        run: |
          bash tests_jdk/run.sh
          python3 tests_jdk/check_shader_contract.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar plataforma Android SDK (runner nativo)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "sdkmanager não encontrado em $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar e testar o aplicativo
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FrameMatch-Android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK de testes para download direto
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/framematch-android' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.1-alpha"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "FrameMatch Android 0.2.1 - cor SDR corrigida" \
              --notes "APK debug de teste. Correção do desvio de gama no color match e zoom padrão desativado. Ainda não validado em celular real. Instale apenas se aceitar testar uma versão experimental." \
              --prerelease
          fi
